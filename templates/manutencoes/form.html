{% extends "base.html" %}

{% block content %}

<h3>{{ "Editar" if m else "Nova" }} Manutenção</h3>

<form method="POST" enctype="multipart/form-data">

  <label>Data de Entrada</label>
  <input type="date" name="data" class="form-control mb-2"
         value="{{ m.data.strftime('%Y-%m-%d') if m and m.data else '' }}">

  <label>Data de Saída</label>
  <input type="date" name="data_saida" class="form-control mb-2"
         value="{{ m.data_saida.strftime('%Y-%m-%d') if m and m.data_saida else '' }}">

  <input name="numero_frota" class="form-control mb-2"
         value="{{ m.numero_frota if m else '' }}" placeholder="Frota">

  <input type="text" name="os" placeholder="Número da OS" class="form-control mb-2"
         value="{{ m.os if m else '' }}">

  <input name="bau" class="form-control mb-2"
         value="{{ m.bau if m else '' }}" placeholder="Baú">

  <input name="tipo_veiculo" class="form-control mb-2"
         value="{{ m.tipo_veiculo if m else '' }}" placeholder="Tipo Veículo">

  <select name="tipo_servico" class="form-control mb-2" required>
    <option value="">Tipo Serviço</option>
    <option value="CORRETIVA" {% if m and m.tipo_servico == "CORRETIVA" %}selected{% endif %}>Corretiva</option>
    <option value="PREVENTIVA" {% if m and m.tipo_servico == "PREVENTIVA" %}selected{% endif %}>Preventiva</option>
  </select>

  <select name="tipo_atendimento" class="form-control mb-2" required>
    <option value="">Tipo Atendimento</option>
    <option value="INTERNO" {% if m and m.tipo_atendimento == "INTERNO" %}selected{% endif %}>Interno</option>
    <option value="EXTERNO" {% if m and m.tipo_atendimento == "EXTERNO" %}selected{% endif %}>Externo</option>
  </select>

  <select name="tipo_manutencao" class="form-control mb-2" required>
    <option value="">Tipo Manutenção</option>
    <option value="Estrutura" {% if m and m.tipo_manutencao == "Estrutura" %}selected{% endif %}>Estrutura</option>
    <option value="Refrigeração" {% if m and m.tipo_manutencao == "Refrigeração" %}selected{% endif %}>Refrigeração</option>
  </select>

  <select name="status" class="form-control mb-2">
    <option value="ANDAMENTO" {% if m and m.status == "ANDAMENTO" %}selected{% endif %}>Em andamento</option>
    <option value="FINALIZADO" {% if m and m.status == "FINALIZADO" %}selected{% endif %}>Finalizado</option>
  </select>

  <select name="cliente" class="form-control mb-2" required>
    <option value="">Selecione o Cliente</option>
    {% for c in clientes %}
      <option value="{{ c.nome }}" {% if m and m.cliente == c.nome %}selected{% endif %}>
        {{ c.nome }}
      </option>
    {% endfor %}
  </select>

  <input name="causa" class="form-control mb-2"
         value="{{ m.causa if m else '' }}" placeholder="Causa">

  <label>Imagem</label>
  <input type="file" name="imagens" class="form-control mb-2" multiple>

  <textarea name="observacao" class="form-control mb-2" placeholder="Observação">{{ m.observacao if m else '' }}</textarea>

  {% if m and imagens_lista %}
    <hr>
    <h5>Imagens cadastradas</h5>

    <div class="d-flex flex-wrap gap-3 mb-3">
      {% for img in imagens_lista %}
        <div style="width: 160px;">
          <img src="{{ img }}"
               style="width: 100%; height: 110px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd;">

          <form method="POST"
                action="/manutencoes/{{ m.id }}/excluir-imagem"
                style="margin-top: 8px;"
                onsubmit="return confirm('Deseja excluir esta imagem?')">
            <input type="hidden" name="imagem_url" value="{{ img }}">
            <button type="submit" class="btn btn-danger btn-sm w-100">
              Excluir imagem
            </button>
          </form>
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <button class="btn btn-primary">Salvar</button>

</form>

{% endblock %}
