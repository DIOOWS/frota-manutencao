{% extends "base.html" %}

{% block content %}

<h3>
  {% if user %}Editar Usuário{% else %}Novo Usuário{% endif %}
</h3>

<a href="/admin/usuarios" class="btn btn-secondary mb-3">
  ← Voltar
</a>

<div class="card p-4" style="max-width: 500px;">

{% if erro %}
  <div class="alert alert-danger">
    {{ erro }}
  </div>
{% endif %}

<form method="POST" enctype="multipart/form-data">

  <label class="fw-bold mb-1">Nome do usuário</label>

  <input name="nome"
         value="{{ user.nome if user else '' }}"
         placeholder="Ex.: João da Oggi"
         class="form-control mb-2"
         required>

  <input name="email"
         value="{{ user.email if user else '' }}"
         placeholder="Email"
         class="form-control mb-2">

  <input type="password"
         name="senha"
         placeholder="{% if user %}Senha (deixe vazio para não alterar){% else %}Senha{% endif %}"
         class="form-control mb-2"
         {% if not user %}required{% endif %}>

  <input type="file" name="foto" class="form-control mb-2">

  <img id="previewFoto"
       src="{{ user.foto if user and user.foto else '' }}"
       style="width:100px; height:100px; border-radius:50%; object-fit:cover; margin-top:10px;">

  <label class="mt-3 mb-1 fw-bold">Nível de acesso</label>

  <select name="role" id="role" class="form-control mb-3">

    <option value="usuario" {% if user and user.role == "usuario" %}selected{% endif %}>
      Cliente / Usuário
    </option>

    <option value="admin" {% if user and user.role == "admin" %}selected{% endif %}>
      Admin
    </option>

    <option value="gestao" {% if user and user.role == "gestao" %}selected{% endif %}>
      Gestão
    </option>

    <option value="gestor" {% if user and user.role == "gestor" %}selected{% endif %}>
      Gestor
    </option>

  </select>

  <div id="boxCliente">
    <label class="fw-bold mb-1">Cliente vinculado</label>

    <select name="cliente_id" id="cliente_id" class="form-control mb-3">
      <option value="">Selecione o cliente</option>

      {% for c in clientes %}
        <option value="{{ c.id }}"
          {% if user and user.cliente_id == c.id %}selected{% endif %}>
          {{ c.nome }}
        </option>
      {% endfor %}
    </select>
  </div>

  <button class="btn btn-success w-100 mt-3">
    Salvar
  </button>

</form>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const roleSelect = document.getElementById("role");
  const boxCliente = document.getElementById("boxCliente");
  const clienteSelect = document.getElementById("cliente_id");
  const inputFoto = document.querySelector('input[name="foto"]');
  const preview = document.getElementById("previewFoto");

  function controlarCamposPorRole() {
    const role = roleSelect.value;

    if (role === "admin" || role === "gestao" || role === "gestor") {
      boxCliente.style.display = "none";
      clienteSelect.required = false;
      clienteSelect.value = "";
    } else {
      boxCliente.style.display = "block";
      clienteSelect.required = true;
    }
  }

  roleSelect.addEventListener("change", controlarCamposPorRole);
  controlarCamposPorRole();

  inputFoto.addEventListener("change", function(event) {
    const file = event.target.files[0];

    if (file) {
      preview.src = URL.createObjectURL(file);
    }
  });
});
</script>

{% endblock %}
