<div class="row g-3 mb-4">

  <div class="col-md-3">
    <div class="kpi-box">
      <div class="kpi-icon">📊</div>
      <div>
        <h2>{{ total or 0 }}</h2>
        <span>Total</span>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="kpi-box danger">
      <div class="kpi-icon">🛠️</div>
      <div>
        <h2>{{ corretivas or 0 }}</h2>
        <span>Corretivas</span>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="kpi-box success">
      <div class="kpi-icon">🛡️</div>
      <div>
        <h2>{{ preventivas or 0 }}</h2>
        <span>Preventivas</span>
      </div>
    </div>
  </div>

  <div class="col-md-3">
    <div class="kpi-box warning">
      <div class="kpi-icon">⏳</div>
      <div>
        <h2>{{ andamento or 0 }}</h2>
        <span>Em andamento</span>
      </div>
    </div>
  </div>

</div>
