<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EASY CONTROL</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS DO SISTEMA -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="neon-login-body login-truck-bg">

  <div class="neon-login-overlay"></div>

  <div class="neon-login-wrapper">

    <div class="neon-login-box">

      <div class="neon-rotating-border"></div>

      <div class="neon-login-glow neon-glow-top"></div>
      <div class="neon-login-glow neon-glow-right"></div>
      <div class="neon-login-glow neon-glow-bottom"></div>
      <div class="neon-login-glow neon-glow-left"></div>

      <div class="neon-login-inner">

        <div class="neon-login-title">
          <h4>EASY CONTROL</h4>
        </div>

        <div class="neon-login-brand">
          LOGIN
        </div>

        {% if erro %}
          <div class="alert alert-danger text-center neon-login-alert">
            {{ erro }}
          </div>
        {% endif %}

        <form method="POST" onsubmit="mostrarLoading()">

          <div class="neon-input-group">
            <i class="bi bi-person"></i>
            <input type="text"
                   name="nome"
                   placeholder="Usuário"
                   required
                   autofocus>
          </div>

          <div class="neon-input-group">
            <i class="bi bi-lock"></i>

            <input type="password"
                   id="senha"
                   name="senha"
                   placeholder="Senha"
                   required>

            <button type="button"
                    class="neon-password-btn"
                    onclick="toggleSenha()">
              <i class="bi bi-eye" id="iconeSenha"></i>
            </button>
          </div>

          <button class="neon-login-btn" id="btnLogin">
            <span id="textoBtn">Entrar</span>
            <span class="spinner-border spinner-border-sm" id="spinner"></span>
          </button>

        </form>

      </div>

    </div>

  </div>

<script>
function toggleSenha() {
  const senha = document.getElementById("senha");
  const icone = document.getElementById("iconeSenha");

  if (senha.type === "password") {
    senha.type = "text";
    icone.classList.replace("bi-eye", "bi-eye-slash");
  } else {
    senha.type = "password";
    icone.classList.replace("bi-eye-slash", "bi-eye");
  }
}

function mostrarLoading() {
  document.getElementById("textoBtn").innerText = "Entrando...";
  document.getElementById("spinner").style.display = "inline-block";
  document.getElementById("btnLogin").disabled = true;
}
</script>

</body>
</html>
