<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - EASY CONTROL</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS DO SISTEMA -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/organized/00-login.css') }}">
</head>

<body class="easy-login-body">

  <video class="easy-login-video" autoplay muted loop playsinline>
    <source src="{{ url_for('static', filename='hero.mp4') }}" type="video/mp4">
  </video>

  <div class="easy-login-bg-fallback"></div>
  <div class="easy-login-overlay"></div>

  <main class="easy-login-wrapper">

    <section class="easy-login-card">

      <div class="easy-login-brand-area">
        <img
          src="{{ url_for('static', filename='img/easy-logo.png') }}"
          alt="Easy Assistência 24h"
          class="easy-login-logo"
        >

        <h1>Easy Control</h1>
        <p>Plataforma Integrada de Gestão Operacional</p>
      </div>

      {% if erro %}
        <div class="alert alert-danger text-center easy-login-alert">
          {{ erro }}
        </div>
      {% endif %}

      <form method="POST" onsubmit="mostrarLoading()" class="easy-login-form">

        <div class="easy-form-group">
          <label for="nome">Usuário</label>
          <div class="easy-input-wrap">
            <i class="bi bi-person"></i>
            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite seu usuário"
              required
              autofocus
              autocomplete="username"
            >
          </div>
        </div>

        <div class="easy-form-group">
          <label for="senha">Senha</label>
          <div class="easy-input-wrap">
            <i class="bi bi-lock"></i>
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Digite sua senha"
              required
              autocomplete="current-password"
            >

            <button type="button" class="easy-password-btn" onclick="toggleSenha()" aria-label="Mostrar ou ocultar senha">
              <i class="bi bi-eye" id="iconeSenha"></i>
            </button>
          </div>
        </div>

        <button class="easy-login-btn" id="btnLogin" type="submit">
          <span id="textoBtn">Acessar Sistema</span>
          <span class="spinner-border spinner-border-sm" id="spinner"></span>
        </button>

      </form>

      <footer class="easy-login-footer">
        Easy Assistência 24h © 2026 · Easy Control v2.0
      </footer>

    </section>

  </main>

<script>
function toggleSenha() {
  const senha = document.getElementById("senha");
  const icone = document.getElementById("iconeSenha");

  if (senha.type === "password") {
    senha.type = "text";
    icone.classList.replace("bi-eye", "bi-eye-slash");
  } else {
    senha.type = "password";
    icone.classList.replace("bi-eye-slash", "bi-eye");
  }
}

function mostrarLoading() {
  document.getElementById("textoBtn").innerText = "Entrando...";
  document.getElementById("spinner").style.display = "inline-block";
  document.getElementById("btnLogin").disabled = true;
}
</script>

</body>
</html>
